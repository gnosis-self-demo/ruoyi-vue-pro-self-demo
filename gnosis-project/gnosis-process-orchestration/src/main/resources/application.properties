spring.application.name=process-orchestration-service
server.port=8085

spring.datasource.url=jdbc:opengauss://localserver.gnosis:5432/gnosis_sample?currentSchema=gnosis_sample
spring.datasource.username=gaussdb
spring.datasource.password=Enmotech@123
spring.datasource.driver-class-name=org.opengauss.Driver

spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.pool-name=ProcessOrchestrationHikariPool
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.initialization-fail-timeout=-1

mybatis-plus.mapper-locations=classpath*:mapper/**/*.xml
mybatis-plus.type-aliases-package=com.gnosis.process.domain
mybatis-plus.configuration.map-underscore-to-camel-case=true

swagger.enable=true
springfox.documentation.enabled=true

logging.level.root=INFO
logging.level.com.gnosis.process=DEBUG
logging.level.org.mybatis=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n

spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=GMT+8
spring.jackson.default-property-inclusion=NON_NULL

spring.sql.init.mode=never

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

spring.autoconfigure.exclude=org.springframework.boot.actuate.autoconfigure.jdbc.DataSourceHealthIndicatorAutoConfiguration
