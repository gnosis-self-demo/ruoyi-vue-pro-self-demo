# 应用基本信息
spring.application.name=distributed-queue-service
server.port=8080

# 数据库配置 (openGauss)
spring.datasource.url=jdbc:opengauss://localserver.gnosis:5432/gnosis_sample
spring.datasource.username=gaussdb
spring.datasource.password=Enmotech@123
spring.datasource.driver-class-name=org.opengauss.Driver

# 数据库连接池配置
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# SQL初始化配置
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.sql.init.continue-on-error=true

# 日志配置
logging.level.root=INFO
logging.level.com.example.demo=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=logs/distributed-queue.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30

# Spring MVC配置
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# Jackson配置
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=GMT+8
spring.jackson.default-property-inclusion=NON_NULL

# 线程池配置
spring.task.execution.pool.core-size=10
spring.task.execution.pool.max-size=50
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=queue-task-

# 定时任务配置
spring.task.scheduling.pool.size=5
spring.task.scheduling.thread-name-prefix=scheduler-

# Actuator监控端点
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# 分布式队列配置
distributed.queue.defaults.max-length=1000
distributed.queue.defaults.max-qps=50
distributed.queue.defaults.poll-interval=1000

# 预定义队列配置
distributed.queue.queues.sms_queue.max-length=1000
distributed.queue.queues.sms_queue.max-qps=100
distributed.queue.queues.sms_queue.poll-interval=500

distributed.queue.queues.email_queue.max-length=500
distributed.queue.queues.email_queue.max-qps=50
distributed.queue.queues.email_queue.poll-interval=1000

distributed.queue.queues.high_priority.enabled=true
distributed.queue.queues.high_priority.max-length=100
distributed.queue.queues.high_priority.max-qps=200
distributed.queue.queues.high_priority.poll-interval=100