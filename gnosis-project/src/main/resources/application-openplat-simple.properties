# ========================================
# 开放平台模块独立启动配置文件（简化版）
# ========================================

# 应用基本信息
spring.application.name=openplat-service
server.port=8080
server.servlet.context-path=/

# ========================
# Database Configuration
# ========================
spring.datasource.url=jdbc:postgresql://localserver.gnosis:5432/gnosis_sample?currentSchema=gnosis_sample
spring.datasource.username=gaussdb
spring.datasource.password=Enmotech@123
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP 配置
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.pool-name=OpenplatHikariPool
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.initialization-fail-timeout=-1

# ========================
# MyBatis Configuration
# ========================
mybatis.mapper-locations=classpath*:mapper/openplat/**/*.xml
mybatis.type-aliases-package=openplat.domain
mybatis.configuration.map-underscore-to-camel-case=true

# ========================
# 禁用不需要的自动配置
# ========================
spring.autoconfigure.exclude=\
  org.springframework.boot.actuate.autoconfigure.jdbc.DataSourceHealthIndicatorAutoConfiguration,\
  com.yomahub.liteflow.springboot.config.LiteflowMainAutoConfiguration

# ========================
# LiteFlow Configuration (禁用)
# ========================
liteflow.enable=false

# ========================
# Swagger Configuration
# ========================
swagger.enable=true
springfox.documentation.enabled=true

# ========================
# Logging Configuration
# ========================
logging.level.root=WARN
logging.level.openplat=DEBUG
logging.level.org.mybatis=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n

# ========================
# JSON Configuration
# ========================
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=GMT+8

# ========================
# 关闭自动 SQL 初始化
# ========================
spring.sql.init.mode=never
