spring.application.name=paramcheck-service
server.port=8084
server.servlet.context-path=/

spring.datasource.url=jdbc:postgresql://localserver.gnosis:5432/gnosis_sample?currentSchema=gnosis_sample
spring.datasource.username=gaussdb
spring.datasource.password=Enmotech@123
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.pool-name=ParamCheckHikariPool
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.initialization-fail-timeout=-1

mybatis.mapper-locations=classpath*:mapper/**/*.xml
mybatis.type-aliases-package=com.gnosis.paramcheck.domain
mybatis.configuration.map-underscore-to-camel-case=true

spring.autoconfigure.exclude=\
  org.springframework.boot.actuate.autoconfigure.jdbc.DataSourceHealthIndicatorAutoConfiguration

liteflow.enable=true
liteflow.rule-source=classpath:liteflow-rule.xml

swagger.enable=true
springfox.documentation.enabled=true

logging.level.root=INFO
logging.level.com.gnosis.paramcheck=DEBUG
logging.level.org.mybatis=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n

spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=GMT+8

spring.sql.init.mode=never

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=16
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=async-
