# 应用名称
spring.application.name=gnosis-notice-center

# 服务端口
server.port=8091
server.servlet.context-path=/notice

# 数据库配置 (OpenGauss)
spring.datasource.type=com.alibaba.druid.pool.DruidDataSource
spring.datasource.driver-class-name=org.opengauss.Driver
spring.datasource.url=jdbc:opengauss://localserver.gnosis:5432/gnosis_sample
spring.datasource.username=gaussdb
spring.datasource.password=Enmotech@123

# Druid连接池配置
spring.datasource.druid.initial-size=5
spring.datasource.druid.min-idle=5
spring.datasource.druid.max-active=20
spring.datasource.druid.max-wait=60000
spring.datasource.druid.time-between-eviction-runs-millis=60000
spring.datasource.druid.min-evictable-idle-time-millis=300000
spring.datasource.druid.validation-query=SELECT 1
spring.datasource.druid.test-while-idle=true
spring.datasource.druid.test-on-borrow=false
spring.datasource.druid.test-on-return=false

# MyBatis-Plus配置
mybatis-plus.mapper-locations=classpath:mapper/notice/*.xml
mybatis-plus.type-aliases-package=com.gnosis.notice.domain
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.cache-enabled=false

# Redis配置
spring.redis.host=localhost
spring.redis.port=6379
spring.redis.database=0
spring.redis.timeout=5000

# 文件配置
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB

# 消息通知配置
# 短信配置 (阿里云SMS)
notice.sms.provider=aliyun
notice.sms.accessKeyId=your-access-key-id
notice.sms.accessKeySecret=your-access-key-secret
notice.sms.signName=your-sign-name

# 邮件配置 (JavaMail)
notice.email.host=smtp.example.com
notice.email.port=465
notice.email.username=your-email@example.com
notice.email.password=your-email-password
notice.email.ssl-enable=true

# 微信配置 (公众号模板消息)
notice.wechat.appId=your-app-id
notice.wechat.appSecret=your-app-secret

# 钉钉配置 (钉钉工作通知)
notice.dingtalk.appKey=your-app-key
notice.dingtalk.appSecret=your-app-secret
notice.dingtalk.agentId=0

# 频率限制配置
notice.frequency.max-per-minute=10

# 重试配置
notice.retry.max-count=3
notice.retry.interval=60000

# 日志配置
logging.level.com.gnosis.notice=debug
logging.level.com.gnosis.notice.mapper=debug
