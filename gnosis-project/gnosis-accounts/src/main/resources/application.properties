spring.application.name=gnosis-accounts
server.port=8087

# openGauss database
spring.datasource.url=jdbc:opengauss://localserver.gnosis:5432/gnosis_sample
spring.datasource.username=gaussdb
spring.datasource.password=Enmotech@123
spring.datasource.driver-class-name=org.opengauss.Driver

# MyBatis
mybatis.mapper-locations=classpath:mapper/accounts/*.xml
mybatis.type-aliases-package=com.gnosis.accounts.domain
mybatis.configuration.map-underscore-to-camel-case=true

# Swagger
springfox.documentation.swagger-ui.enabled=true

# Initialize database schema (set to never after first run)
spring.datasource.initialization-mode=never
spring.datasource.schema=classpath:db/accounts/accounts-opengauss.sql
spring.datasource.sql-script-encoding=UTF-8

# File upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
