spring.application.name=gnosis-signature-plat
server.port=8095

# openGauss database
spring.datasource.url=jdbc:opengauss://localserver.gnosis:5432/gnosis_sample
spring.datasource.username=gaussdb
spring.datasource.password=Enmotech@123
spring.datasource.driver-class-name=org.opengauss.Driver

# Druid datasource pool
spring.datasource.type=com.alibaba.druid.pool.DruidDataSource
spring.datasource.druid.initial-size=5
spring.datasource.druid.min-idle=5
spring.datasource.druid.max-active=20
spring.datasource.druid.max-wait=60000
spring.datasource.druid.time-between-eviction-runs-millis=60000
spring.datasource.druid.min-evictable-idle-time-millis=300000
spring.datasource.druid.validation-query=SELECT 1
spring.datasource.druid.test-while-idle=true
spring.datasource.druid.test-on-borrow=false
spring.datasource.druid.test-on-return=false

# Redis
spring.redis.host=localserver.gnosis
spring.redis.port=6379
spring.redis.database=0
spring.redis.timeout=5000

# MyBatis
mybatis.mapper-locations=classpath:mapper/signature/*.xml
mybatis.type-aliases-package=com.gnosis.signature.domain
mybatis.configuration.map-underscore-to-camel-case=true

# Swagger
springfox.documentation.swagger-ui.enabled=true

# Initialize database schema (set to never after first run)
spring.datasource.initialization-mode=always
spring.datasource.schema=classpath:db/signature/signature-opengauss.sql
spring.datasource.sql-script-encoding=UTF-8

# File upload
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Jasypt encryption
jasypt.encryptor.password=gnosis-signature-key

# Logging (Logback)
logging.level.com.gnosis.signature.mapper=debug
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
