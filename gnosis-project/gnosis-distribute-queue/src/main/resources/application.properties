spring.application.name=distributed-queue-service
server.port=8081

spring.datasource.url=jdbc:postgresql://localserver.gnosis:5432/gnosis_sample?currentSchema=gnosis_sample
spring.datasource.username=gaussdb
spring.datasource.password=Enmotech@123
spring.datasource.driver-class-name=org.postgresql.Driver

mybatis-plus.mapper-locations=classpath*:mapper/**/*.xml
mybatis-plus.type-aliases-package=com.gnosis.distribute.queue.model
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.global-config.db-config.id-type=auto
mybatis-plus.global-config.db-config.table-underline=false

liteflow.rule-source=classpath:liteflow-rule.xml

spring.sql.init.mode=never

logging.level.root=INFO
logging.level.com.gnosis.distribute.queue=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=logs/distributed-queue.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30

spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=GMT+8
spring.jackson.default-property-inclusion=NON_NULL

spring.task.execution.pool.core-size=10
spring.task.execution.pool.max-size=50
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=queue-task-

spring.task.scheduling.pool.size=5
spring.task.scheduling.thread-name-prefix=scheduler-

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

distributed.queue.sms.maxLength=1000
distributed.queue.sms.maxQps=100
distributed.queue.sms.pollInterval=500

distributed.queue.email.maxLength=500
distributed.queue.email.maxQps=50
distributed.queue.email.pollInterval=1000

distributed.queue.notification.maxLength=2000
distributed.queue.notification.maxQps=200
distributed.queue.notification.pollInterval=100
