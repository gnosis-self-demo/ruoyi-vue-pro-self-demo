spring.application.name=openplat-service
server.port=8084

spring.datasource.url=jdbc:opengauss://localserver.gnosis:5432/gnosis_sample
spring.datasource.username=gaussdb
spring.datasource.password=Enmotech@123
spring.datasource.driver-class-name=org.opengauss.Driver

spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.pool-name=OpenplatHikariPool
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.connection-test-query=SELECT 1

mybatis.mapper-locations=classpath*:mapper/**/*.xml
mybatis.type-aliases-package=com.gnosis.openplat.domain
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.cache-enabled=true
mybatis.configuration.lazy-loading-enabled=false
mybatis.configuration.aggressive-lazy-loading=false
mybatis.configuration.default-executor-type=simple

liteflow.enable=false

swagger.enable=true
springfox.documentation.enabled=true

logging.level.root=INFO
logging.level.com.gnosis.openapi=DEBUG
logging.level.org.mybatis=DEBUG
logging.level.com.zaxxer.hikari=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=logs/openplat.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30

spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=GMT+8
spring.jackson.default-property-inclusion=NON_NULL

spring.task.scheduling.pool.size=5
spring.task.scheduling.thread-name-prefix=scheduler-

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

spring.sql.init.mode=never

spring.autoconfigure.exclude=org.springframework.boot.actuate.autoconfigure.jdbc.DataSourceHealthIndicatorAutoConfiguration
